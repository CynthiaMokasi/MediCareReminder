name: API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore API
        working-directory: API/MediCareReminderAPI
        run: dotnet restore

      - name: Build API
        working-directory: API/MediCareReminderAPI
        run: dotnet build --no-restore
